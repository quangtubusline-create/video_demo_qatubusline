<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe - Main Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-white sm:bg-gray-100 flex justify-center items-center min-h-[100dvh] m-0 p-0 overflow-hidden select-none">

  <!-- Khung mô phỏng ứng dụng di động -->
  <div class="relative w-full h-[100dvh] sm:max-w-[430px] sm:h-[92dvh] sm:max-h-[932px] bg-black flex flex-col overflow-hidden sm:rounded-[32px] sm:shadow-2xl">
    
    <!-- ================= 1. NAVBAR TRÊN CỐ ĐỊNH ================= -->
    <header class="absolute top-0 inset-x-0 flex items-center justify-between px-4 py-3 bg-white/90 backdrop-blur-md z-30 border-b border-gray-100/50">
      <div class="flex items-center gap-1.5">
        <div class="w-[22px] h-[22px] rounded-md bg-gradient-to-br from-rose-600 to-rose-400 flex items-center justify-center text-white font-bold text-xs">
          V
        </div>
        <span class="text-[19px] font-bold text-gray-900 tracking-tight">Vibe</span>
      </div>

      <h1 class="text-[17px] font-semibold text-gray-900">Trang Chủ</h1>

      <div class="flex items-center gap-3.5">
        <button id="refreshBtn" title="Tải lại video" class="text-gray-900 hover:opacity-75 transition" aria-label="Làm mới">
          <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.65-5.65"></path>
          </svg>
        </button>
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-gray-200">
      </div>
    </header>


    <!-- ================= 2. KHU VỰC IFRAME Ở GIỮA (CHỨA VIDEO) ================= -->
    <!-- Sử dụng absolute inset-0 để thẻ iframe lấp đầy khoảng trống giữa 2 navbar -->
    <main class="absolute inset-0 z-10 overflow-hidden bg-black">
      <iframe 
        id="videoFrame" 
        src="./player.html" 
        class="w-full h-full border-0" 
        allow="autoplay; fullscreen"
      ></iframe>
    </main>


    <!-- ================= 3. NAVBAR DƯỚI CỐ ĐỊNH ================= -->
    <nav class="absolute bottom-0 inset-x-0 flex items-center justify-around px-2 pt-2 pb-[max(14px,env(safe-area-inset-bottom))] bg-white/90 backdrop-blur-md border-t border-gray-100 z-30">
      <button class="flex flex-col items-center gap-1 text-gray-900 text-[11px] font-semibold min-w-[56px]">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Trang chủ</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-gray-500 text-[11px] font-medium min-w-[56px]">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
        <span>Khám phá</span>
      </button>

      <!-- Nút tròn giữa (có thể dùng để gọi hàm đổi video trong iframe) -->
      <button id="centerActionBtn" class="w-[46px] h-[46px] rounded-full bg-rose-600 text-white flex items-center justify-center shadow-lg shadow-rose-600/35 active:scale-95 transition" aria-label="Thao tác">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <button class="flex flex-col items-center gap-1 text-gray-500 text-[11px] font-medium min-w-[56px]">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Hộp thư</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-gray-500 text-[11px] font-medium min-w-[56px]">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Hồ sơ" class="w-6 h-6 rounded-full object-cover">
        <span>Hồ sơ</span>
      </button>
    </nav>

  </div>

  <script>
    // Ví dụ liên kết tương tác giữa trang chính (index) và file iframe con (player.html)
    const videoFrame = document.getElementById('videoFrame');

    // Khi bấm nút làm mới trên header hoặc nút tròn ở giữa navbar, có thể yêu cầu iframe load lại hoặc đổi video
    function triggerAction() {
      if (videoFrame.contentWindow && typeof videoFrame.contentWindow.loadNextVideo === 'function') {
        // Nếu file player.html có định nghĩa sẵn hàm loadNextVideo()
        videoFrame.contentWindow.loadNextVideo();
      } else {
        // Hoặc đơn giản là reload lại src của iframe
        videoFrame.src = videoFrame.src;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', triggerAction);
    document.getElementById('centerActionBtn').addEventListener('click', triggerAction);
  </script>
</body>
</html>
