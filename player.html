<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Vibe - Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0;
      font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden;
    }
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    .animate-disc { animation: spin-slow 6s linear infinite; }
    .music-disc-gradient { background: radial-gradient(circle, #e11d48 0%, #e11d48 35%, #fff 36%, #fff 48%, #262626 49%, #171717 100%); }
    @keyframes slideUp { from { transform: translateY(30%); opacity: 0.35; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-30%); opacity: 0.35; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>
</head>
<body class="select-none bg-black">

  <div id="swipeContainer" class="relative w-full h-[100dvh] flex flex-col justify-between overflow-hidden bg-black">
    
    <!-- Sân khấu Video -->
    <div id="videoStage" class="absolute inset-x-0 top-0 bottom-0 z-[1] flex items-center justify-center bg-black overflow-hidden">
      
      <!-- Trình phát Google Drive Preview chính thức (Chạy chuẩn 100% không bị kẹt màn hình đen/loading) -->
      <iframe 
        id="driveIframe" 
        class="w-full h-full border-0 bg-black" 
        allow="autoplay; fullscreen; encrypted-media"
        allowfullscreen
      ></iframe>

      <!-- Màn hình chờ siêu ngắn khi chuyển video -->
      <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-neutral-950/80 text-white z-20 px-6 text-center pointer-events-none transition-opacity duration-300">
        <div class="w-9 h-9 border-4 border-rose-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-xs text-white/80 font-medium">Đang mở video...</p>
      </div>
    </div>
    
    <!-- Gradients -->
    <div class="absolute top-0 inset-x-0 h-20 bg-gradient-to-b from-black/60 to-transparent z-[2] pointer-events-none"></div>
    <div class="absolute bottom-0 inset-x-0 h-40 bg-gradient-to-t from-black/85 via-black/30 to-transparent z-[2] pointer-events-none"></div>

    <!-- 2 Icon Lên / Xuống bên trái -->
    <div class="absolute left-3 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-3">
      <button id="prevVideoIconBtn" class="w-10 h-10 rounded-full bg-black/55 backdrop-blur-md border border-white/25 text-white flex items-center justify-center hover:bg-rose-600 active:scale-90 transition shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button id="nextVideoIconBtn" class="w-10 h-10 rounded-full bg-black/55 backdrop-blur-md border border-white/25 text-white flex items-center justify-center hover:bg-rose-600 active:scale-90 transition shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <!-- Thanh tương tác phải -->
    <aside class="absolute right-3 bottom-16 z-30 flex flex-col items-center gap-3.5">
      <div class="relative mb-1">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80" alt="Creator" class="w-11 h-11 rounded-full border-2 border-white object-cover">
        <button class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-bold shadow">+</button>
      </div>
      <div id="likeBtn" class="flex flex-col items-center gap-1 cursor-pointer group">
        <div class="w-11 h-11 rounded-full bg-black/45 backdrop-blur-md border border-white/15 flex items-center justify-center text-white group-active:scale-90 transition">
          <svg id="heartIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </div>
        <span class="text-[11px] font-semibold text-white">184.2K</span>
      </div>
      <div class="w-10 h-10 rounded-full music-disc-gradient border-2 border-white/60 animate-disc mt-1"></div>
    </aside>

    <!-- Thông tin video -->
    <div class="absolute bottom-16 left-14 right-16 z-[3] text-white pointer-events-none">
      <div class="flex items-center gap-1.5 mb-1">
        <span id="authorHandle" class="text-sm font-bold drop-shadow">@user</span>
        <span class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">TÁC GIẢ</span>
        <span id="videoCounter" class="text-[11px] text-white/75 ml-1"></span>
      </div>
      <p id="videoCaption" class="text-xs leading-snug text-white/95 mb-1.5">Kéo lên hoặc bấm nút xuống để xem video mới 🎬</p>
      <div class="flex items-center gap-1.5">
        <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <span id="videoTimestamp" class="text-[11px] text-white/85 truncate">Original sound</span>
      </div>
    </div>
  </div>

  <script>
    // Danh sách video lấy trực tiếp từ dữ liệu Google Sheets của bạn[cite: 1]
    const videoList = [
      { timestamp: '22/11/2026 21:00:40', userId: '1234', rawUrl: 'https://drive.google.com/open?id=1tXFa4QPFqVJKU7-R_oDUwbDY0ypfTKYY' },
      { timestamp: '22/11/2026 21:19:35', userId: '124', rawUrl: 'https://drive.google.com/open?id=183XhyBS0ZBmdXTl_b5XOS-yAJ1ACGZbt' }
    ];
    
    let historyStack = [];
    let historyIndex = -1;

    const driveIframe = document.getElementById('driveIframe');
    const videoStage = document.getElementById('videoStage');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const authorHandle = document.getElementById('authorHandle');
    const videoTimestamp = document.getElementById('videoTimestamp');
    const videoCounter = document.getElementById('videoCounter');
    const swipeContainer = document.getElementById('swipeContainer');

    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]{15,})/);
      return match ? match[1] : null;
    }

    function loadNextVideo(isInitial = false) {
      if (videoList.length === 0) return;
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      let randomIndex = Math.floor(Math.random() * videoList.length);
      if (videoList.length > 1 && historyStack.length > 0) {
        while (videoList[randomIndex].rawUrl === historyStack[historyStack.length - 1].rawUrl) {
          randomIndex = Math.floor(Math.random() * videoList.length);
        }
      }

      historyStack.push(videoList[randomIndex]);
      historyIndex = historyStack.length - 1;
      renderCurrentVideo('up', isInitial);
    }

    function loadPreviousVideo() {
      if (historyIndex > 0) {
        historyIndex--;
        renderCurrentVideo('down', false);
      }
    }

    function renderCurrentVideo(direction, isInitial) {
      const item = historyStack[historyIndex];

      if (!isInitial) {
        videoStage.classList.remove('animate-slide-up', 'animate-slide-down');
        void videoStage.offsetWidth;
        videoStage.classList.add(direction === 'up' ? 'animate-slide-up' : 'animate-slide-down');
      }

      authorHandle.textContent = `@${item.userId}`;
      videoTimestamp.textContent = `Đăng lúc: ${item.timestamp}`;
      videoCounter.textContent = `(${historyIndex + 1}/${historyStack.length})`;

      // Hiện loading mờ nhẹ trong lúc iframe load
      loadingOverlay.style.opacity = '1';
      loadingOverlay.style.pointerEvents = 'auto';

      const driveId = extractDriveId(item.rawUrl);
      if (driveId) {
        driveIframe.src = `https://drive.google.com/file/d/${driveId}/preview?autoplay=1`;
        
        // Ẩn bảng loading sau 1.2 giây khi iframe đã nạp xong
        setTimeout(() => {
          loadingOverlay.style.opacity = '0';
          loadingOverlay.style.pointerEvents = 'none';
        }, 1200);
      } else {
        loadingOverlay.style.opacity = '0';
        loadingOverlay.style.pointerEvents = 'none';
      }
    }

    // Các hàm giao tiếp toàn cục
    window.loadNextVideo = function() { loadNextVideo(false); };
    window.loadPreviousVideo = function() { loadPreviousVideo(); };

    document.getElementById('prevVideoIconBtn').addEventListener('click', (e) => { e.stopPropagation(); loadPreviousVideo(); });
    document.getElementById('nextVideoIconBtn').addEventListener('click', (e) => { e.stopPropagation(); loadNextVideo(false); });

    let touchStartY = 0;
    swipeContainer.addEventListener('touchstart', (e) => { touchStartY = e.changedTouches[0].screenY; }, { passive: true });
    swipeContainer.addEventListener('touchend', (e) => {
      const diffY = touchStartY - e.changedTouches[0].screenY;
      if (diffY > 50) loadNextVideo(false);
      else if (diffY < -50) loadPreviousVideo();
    }, { passive: true });

    let isScrolling = false;
    window.addEventListener('wheel', (e) => {
      if (isScrolling) return;
      if (e.deltaY > 40) {
        isScrolling = true; loadNextVideo(false);
        setTimeout(() => { isScrolling = false; }, 600);
      } else if (e.deltaY < -40) {
        isScrolling = true; loadPreviousVideo();
        setTimeout(() => { isScrolling = false; }, 600);
      }
    }, { passive: true });

    // Khởi chạy ngay lập tức
    if (videoList.length > 0) {
      loadNextVideo(true);
    }
  </script>
</body>
</html>
