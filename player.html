<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe - Player View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000; overflow: hidden;
    }
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    .animate-disc { animation: spin-slow 6s linear infinite; }
    .music-disc-gradient { background: radial-gradient(circle, #e11d48 0%, #e11d48 35%, #fff 36%, #fff 48%, #262626 49%, #171717 100%); }
  </style>
</head>
<body class="select-none bg-black">

  <div id="swipeContainer" class="relative w-full h-[100dvh] flex flex-col justify-between overflow-hidden bg-black">
    
    <!-- Sân khấu Video -->
    <div id="videoStage" class="absolute inset-x-0 top-[56px] bottom-[68px] z-[1] flex items-center justify-center bg-black overflow-hidden">
      
      <!-- Thẻ Video HTML5 chuẩn (Dành cho link .mp4 trực tiếp) -->
      <video 
        id="mainVideo" 
        class="w-full h-full object-contain" 
        playsinline 
        autoplay 
        muted 
        loop
      ></video>

      <!-- Khung iframe dự phòng nếu dùng link web hoặc YouTube -->
      <iframe 
        id="webIframe" 
        class="hidden w-full h-full border-0 bg-black" 
        allow="autoplay; fullscreen"
      ></iframe>

      <!-- Màn hình chờ hoặc thông báo lỗi -->
      <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-neutral-950 text-white z-20 px-6 text-center">
        <div id="spinner" class="w-9 h-9 border-4 border-rose-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p id="loadingText" class="text-xs text-white/80 font-medium">Đang tải danh sách video từ Google Sheets[cite: 1]...</p>
      </div>
    </div>
    
    <div class="absolute top-[56px] inset-x-0 h-20 bg-gradient-to-b from-black/60 to-transparent z-[2] pointer-events-none"></div>
    <div class="absolute bottom-[68px] inset-x-0 h-36 bg-gradient-to-t from-black/85 via-black/30 to-transparent z-[2] pointer-events-none"></div>

    <!-- 2 Icon Lên / Xuống bên trái -->
    <div class="absolute left-3 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-3">
      <button id="prevVideoIconBtn" title="Video cũ" class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/25 text-white flex items-center justify-center hover:bg-rose-600 active:scale-90 transition shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button id="nextVideoIconBtn" title="Video mới" class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/25 text-white flex items-center justify-center hover:bg-rose-600 active:scale-90 transition shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <!-- Thanh tương tác bên phải -->
    <aside class="absolute right-3 bottom-24 z-30 flex flex-col items-center gap-3.5">
      <div class="relative mb-1">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80" alt="Creator" class="w-11 h-11 rounded-full border-2 border-white object-cover">
        <button class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-bold shadow">+</button>
      </div>
      <div id="likeBtn" class="flex flex-col items-center gap-1 cursor-pointer group">
        <div class="w-11 h-11 rounded-full bg-black/45 backdrop-blur-md border border-white/15 flex items-center justify-center text-white group-active:scale-90 transition">
          <svg id="heartIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </div>
        <span class="text-[11px] font-semibold text-white drop-shadow">184.2K</span>
      </div>
      <div class="relative mt-1">
        <div class="w-10 h-10 rounded-full music-disc-gradient border-2 border-white/60 animate-disc"></div>
      </div>
    </aside>

    <!-- Thông tin video -->
    <div class="absolute bottom-24 left-14 right-[70px] z-[3] text-white pointer-events-none">
      <div class="flex items-center gap-1.5 mb-1">
        <span id="authorHandle" class="text-sm font-bold drop-shadow">@user</span>
        <span class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">TÁC GIẢ</span>
        <span id="videoCounter" class="text-[11px] text-white/75 ml-1"></span>
      </div>
      <p id="videoCaption" class="text-xs leading-snug text-white/95 mb-1.5 drop-shadow">Dùng 2 nút trái để đổi video 🎬</p>
      <div class="flex items-center gap-1.5">
        <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <span id="videoTimestamp" class="text-[11px] text-white/85 truncate">Original sound</span>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQ0fmevto-mto5JkkHV03QLY_Q4PPwkP2uj4vjoymVFBSopIz3F-LsHpXXrVz3dnPnaat93zqMOvG2/pub?gid=399187117&single=true&output=csv';
    
    let videoList = [];
    let historyStack = [];
    let historyIndex = -1;

    const mainVideo = document.getElementById('mainVideo');
    const webIframe = document.getElementById('webIframe');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const spinner = document.getElementById('spinner');
    const authorHandle = document.getElementById('authorHandle');
    const videoTimestamp = document.getElementById('videoTimestamp');
    const videoCounter = document.getElementById('videoCounter');

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const items = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim());
        if (cols.length >= 3 && cols[2]) {
          items.push({ timestamp: cols[0] || '', userId: cols[1] || 'user', rawUrl: cols[2] });
        }
      }
      return items;
    }

    async function fetchVideos() {
      try {
        const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
        if (!res.ok) throw new Error('Lỗi tải CSV');
        const csvText = await res.text();
        videoList = parseCSV(csvText);
        
        if (videoList.length > 0) {
          loadNextVideo(true);
        } else {
          spinner.style.display = 'none';
          loadingText.textContent = 'Google Sheets trống dữ liệu!';
        }
      } catch (err) {
        spinner.style.display = 'none';
        loadingText.innerHTML = `<span class="text-rose-400">Không tải được dữ liệu.<br>Hãy chắc chắn bạn đang dùng Live Server trên VS Code.</span>`;
      }
    }

    function loadNextVideo(isInitial = false) {
      if (videoList.length === 0) return;
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      let randomIndex = Math.floor(Math.random() * videoList.length);
      if (videoList.length > 1 && historyStack.length > 0) {
        while (videoList[randomIndex].rawUrl === historyStack[historyStack.length - 1].rawUrl) {
          randomIndex = Math.floor(Math.random() * videoList.length);
        }
      }

      historyStack.push(videoList[randomIndex]);
      historyIndex = historyStack.length - 1;
      renderCurrentVideo();
    }

    function loadPreviousVideo() {
      if (historyIndex > 0) {
        historyIndex--;
        renderCurrentVideo();
      }
    }

    function renderCurrentVideo() {
      const item = historyStack[historyIndex];
      authorHandle.textContent = `@${item.userId}`;
      videoTimestamp.textContent = `Đăng lúc: ${item.timestamp}`;
      videoCounter.textContent = `(${historyIndex + 1}/${historyStack.length})`;

      loadingOverlay.classList.remove('hidden');

      // Kiểm tra nếu là link Google Drive dạng preview hoặc link web khác
      if (item.rawUrl.includes('drive.google.com')) {
        mainVideo.classList.add('hidden');
        mainVideo.src = '';
        webIframe.classList.remove('hidden');
        
        // Chuyển đổi link open?id= thành dạng nhúng preview chính xác
        let embedUrl = item.rawUrl;
        const match = item.rawUrl.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]{15,})/);
        if (match) {
          embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
        }
        webIframe.src = embedUrl;
        loadingOverlay.classList.add('hidden');
      } else {
        // Dùng thẻ video HTML5 cho link file .mp4 trực tiếp
        webIframe.classList.add('hidden');
        webIframe.src = '';
        mainVideo.classList.remove('hidden');
        mainVideo.src = item.rawUrl;
        mainVideo.muted = true;
        mainVideo.play().then(() => {
          loadingOverlay.classList.add('hidden');
        }).catch(() => {
          loadingOverlay.classList.add('hidden');
        });
      }
    }

    window.loadNextVideo = () => loadNextVideo(false);
    window.loadPreviousVideo = () => loadPreviousVideo();

    document.getElementById('prevVideoIconBtn').addEventListener('click', (e) => { e.stopPropagation(); loadPreviousVideo(); });
    document.getElementById('nextVideoIconBtn').addEventListener('click', (e) => { e.stopPropagation(); loadNextVideo(false); });

    let isScrolling = false;
    window.addEventListener('wheel', (e) => {
      if (isScrolling) return;
      if (e.deltaY > 40) {
        isScrolling = true; loadNextVideo(false);
        setTimeout(() => { isScrolling = false; }, 600);
      } else if (e.deltaY < -40) {
        isScrolling = true; loadPreviousVideo();
        setTimeout(() => { isScrolling = false; }, 600);
      }
    }, { passive: true });

    fetchVideos();
  </script>
</body>
</html>
