<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe - Hồ Sơ Cá Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile-style.css">
</head>
<body class="bg-white sm:bg-gray-100 flex justify-center items-center min-h-[100dvh] m-0 p-0 overflow-hidden select-none">

  <div class="w-full h-[100dvh] sm:max-w-[430px] sm:h-[92dvh] sm:max-h-[932px] bg-white flex flex-col overflow-hidden sm:rounded-[32px] sm:shadow-2xl relative">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between px-4 py-3 bg-white z-20 shrink-0 border-b border-gray-100">
      <button onclick="history.back()" class="text-gray-900 hover:opacity-75 transition p-1" title="Quay lại">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <h1 class="text-[17px] font-bold text-gray-900 tracking-tight">Hồ Sơ Cá Nhân</h1>

      <button class="text-gray-900 hover:opacity-75 transition p-1" title="Cài đặt">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Scrollable Profile Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 pb-6">
      
      <!-- Cover & Avatar Section -->
      <div class="relative bg-white pb-4 shadow-xs">
        <div class="h-28 bg-gradient-to-r from-rose-600 via-rose-500 to-indigo-600 relative">
          <div class="absolute inset-0 bg-black/10"></div>
        </div>

        <div class="px-4 -mt-12 flex justify-between items-end relative z-10">
          <!-- Khung chứa Avatar (Sẽ tự động hiển thị chữ cái đại diện từ localStorage) -->
          <div id="profileAvatarContainer" class="relative">
            <div class="w-24 h-24 rounded-full border-4 border-white bg-gradient-to-br from-rose-600 to-rose-400 text-white flex items-center justify-center font-bold text-2xl shadow-md">
              QT
            </div>
            <span class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-white" title="Đang hoạt động"></span>
          </div>

          <div class="flex gap-2 mb-1">
            <button class="px-4 py-1.5 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs shadow-md shadow-rose-600/30 transition active:scale-95">
              Sửa hồ sơ
            </button>
            <button class="px-3 py-1.5 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-xs transition">
              Chia sẻ
            </button>
          </div>
        </div>

        <!-- User Info -->
        <div class="px-4 pt-3">
          <div class="flex items-center gap-1.5">
            <h2 id="profileFullName" class="text-xl font-bold text-gray-900 tracking-tight">Kim Quang Tú</h2>
            <svg class="w-4 h-4 text-blue-500 fill-blue-500" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
          <p id="profileHandle" class="text-xs text-gray-500 font-medium mt-0.5">@quangtu.it • Đại học Mở TP.HCM</p>
          <p class="text-xs text-gray-700 mt-2.5 leading-relaxed">
            💻 Đam mê Web Development & UI/UX Design. Đang phát triển hệ sinh thái web quản lý giao vận & ứng dụng học tập thông minh. 🚀
          </p>

          <!-- Stats Row -->
          <div class="flex items-center gap-6 mt-4 pt-3 border-t border-gray-100 text-center">
            <div>
              <span class="block text-base font-bold text-gray-900">142</span>
              <span class="text-[11px] text-gray-500 font-medium">Đang theo dõi</span>
            </div>
            <div>
              <span class="block text-base font-bold text-gray-900">12.8K</span>
              <span class="text-[11px] text-gray-500 font-medium">Người föllo</span>
            </div>
            <div>
              <span class="block text-base font-bold text-rose-600">89.4K</span>
              <span class="text-[11px] text-gray-500 font-medium">Thích & Thả tim</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <div class="sticky top-0 bg-white border-b border-gray-200 flex z-10">
        <button class="flex-1 py-3 text-xs font-bold text-rose-600 border-b-2 border-rose-600 text-center transition">Video của tôi (12)</button>
        <button class="flex-1 py-3 text-xs font-semibold text-gray-500 hover:text-gray-900 text-center transition">Đã thích (38)</button>
        <button class="flex-1 py-3 text-xs font-semibold text-gray-500 hover:text-gray-900 text-center transition">Đã lưu (4)</button>
      </div>

      <!-- Grid Videos/Projects -->
      <div class="grid grid-cols-3 gap-1 p-1 bg-white">
        <!-- Item 1 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>12.4K</span>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>8.2K</span>
          </div>
        </div>

        <!-- Item 3 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>24.1K</span>
          </div>
        </div>

        <!-- Item 4 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1607799279861-4dd421887fb3?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>5.9K</span>
          </div>
        </div>

        <!-- Item 5 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1504639725590-34d0984388bd?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>19.3K</span>
          </div>
        </div>

        <!-- Item 6 -->
        <div class="relative aspect-[9/16] bg-neutral-900 overflow-hidden group cursor-pointer">
          <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=300&q=80" alt="Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <div class="absolute bottom-2 left-2 flex items-center gap-1 text-white text-[11px] font-semibold drop-shadow">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>9.6K</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="flex items-center justify-around px-2 pt-2 pb-[max(14px,env(safe-area-inset-bottom))] bg-white border-t border-gray-100 shrink-0 z-20">
      <button onclick="location.href='index.html'" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-900 text-[11px] font-medium min-w-[56px] transition">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Trang chủ</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-900 text-[11px] font-medium min-w-[56px] transition">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
        <span>Khám phá</span>
      </button>

      <button class="w-[46px] h-[46px] rounded-full bg-rose-600 text-white flex items-center justify-center shadow-lg shadow-rose-600/35 active:scale-95 transition">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-900 text-[11px] font-medium min-w-[56px] transition">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Hộp thư</span>
      </button>

      <button class="flex flex-col items-center gap-1 text-rose-600 text-[11px] font-bold min-w-[56px]">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Hồ sơ" class="w-6 h-6 rounded-full object-cover border-2 border-rose-600">
        <span>Hồ sơ</span>
      </button>
    </nav>

  </div>

  <script>
    (function() {
      const USER_STORAGE_KEY = 'vibe_registered_user';
      const savedRaw = localStorage.getItem(USER_STORAGE_KEY);
      
      if (savedRaw) {
        try {
          const user = JSON.parse(savedRaw);
          
          // 1. Cập nhật Họ và tên
          if (user.fullName) {
            const nameEl = document.getElementById('profileFullName');
            if (nameEl) nameEl.textContent = user.fullName;

            // 2. Tự động tạo chữ cái đại diện (Initials) từ tên (VD: "Kim Quang Tú" -> "QT")
            const nameParts = user.fullName.trim().split(/\s+/);
            let initials = 'QT';
            if (nameParts.length >= 2) {
              initials = (nameParts[nameParts.length - 2][0] + nameParts[nameParts.length - 1][0]).toUpperCase();
            } else if (nameParts.length === 1) {
              initials = nameParts[0].substring(0, 2).toUpperCase();
            }

            // 3. Hiển thị chữ cái đại diện lên Avatar
            const avatarContainer = document.getElementById('profileAvatarContainer');
            if (avatarContainer) {
              avatarContainer.innerHTML = `
                <div class="w-24 h-24 rounded-full border-4 border-white bg-gradient-to-br from-rose-600 to-rose-400 text-white flex items-center justify-center font-bold text-2xl shadow-md">
                  ${initials}
                </div>
                <span class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-white" title="Đang hoạt động"></span>
              `;
            }
          }

          // 4. Cập nhật Handle (@username) dựa trên email nếu có
          if (user.email) {
            const handleEl = document.getElementById('profileHandle');
            if (handleEl) {
              const emailPrefix = user.email.split('@')[0];
              handleEl.textContent = `@${emailPrefix} • Đại học Mở TP.HCM`;
            }
          }
        } catch (e) {
          console.error('Không thể đọc thông tin người dùng từ localStorage:', e);
        }
      }
    })();
  </script>
</body>
</html>
